[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iitkquotes"
version = "0.1.0"
description = "A lightweight package for random or indexed IIT Kanpur quotes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your_email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/soysaurav/iitkquotes"

# Ensures hatchling packages .txt files inside src/iitkquotes
[tool.hatch.build.targets.wheel]
packages = ["src/iitkquotes"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/iitkquotes",
]